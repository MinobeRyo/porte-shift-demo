<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="勤務希望とスタッフ基本条件を入力・確認できる仮公開デモ。">
  <title>ポルテ｜文章から月間希望表へ</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=4feda00f53eb">
  <link rel="stylesheet" href="monthly.css?v=be3ae3bbb6d2">
</head>
<body>
  <header>
    <div><h1>ポルテ シフト管理</h1></div>
    <label>対象年月 <input id="target-month" type="month" min="2020-01" max="2100-12" required></label>
  </header>
  <aside class="demo-note"><span id="usage-note">勤務希望の下書き · このブラウザに保存</span><details class="demo-details"><summary>このデモについて</summary><p id="demo-description">対応する文章は規則で、それ以外はこのPCのQwenで読み取ります。入力は他の端末と共有されません。確定シフトではありません。</p></details></aside>
  <nav aria-label="操作メニュー">
    <button data-view="intake" aria-current="page">希望を入力</button>
    <button data-view="month">希望表</button>
    <button data-view="coverage">人数チェック</button>
    <button data-view="excel">Excel</button>
    <button data-view="staff">スタッフ</button>
    <button data-view="staff-edit">スタッフ編集</button>
    <button data-view="history">履歴</button>
  </nav>
  <main id="content"></main>
  <p id="message" role="status" aria-live="polite"></p>
  <dialog id="modal" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <footer>Patisserie ポルテ · 仮公開デモ</footer>
  <script type="module" src="monthly-app.js?v=16ff71f4824a"></script>
</body>
</html>
